# Example Kubernetes Secret template
# Replace base64 values or apply directly via `kubectl create secret generic preparsenal-secrets ...`
apiVersion: v1
kind: Secret
metadata:
  name: preparsenal-secrets
  namespace: preparsenal
  labels:
    app.kubernetes.io/name: preparsenal
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder"
  SUPABASE_SERVICE_ROLE_KEY: "sb_service_role_placeholder"
  GEMINI_API_KEY: "gemini_api_key_placeholder"
  GROQ_API_KEY: "groq_api_key_placeholder"
  GK_HARVESTER_EMAIL: "gk-harvester-bot@example.com"
  GK_HARVESTER_PASSWORD: "gk_harvester_password_placeholder"
