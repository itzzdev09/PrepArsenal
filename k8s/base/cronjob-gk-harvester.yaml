apiVersion: batch/v1
kind: CronJob
metadata:
  name: gk-harvester-daily
  namespace: preparsenal
  labels:
    app.kubernetes.io/name: preparsenal
    app.kubernetes.io/component: gk-worker
spec:
  # Run daily at 03:30 AM UTC
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800 # 30 minutes max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: preparsenal
            app.kubernetes.io/component: gk-worker
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gk-harvester
              image: ghcr.io/itzzdev09/preparsenal/worker:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/gk_harvester.py"]
              envFrom:
                - configMapRef:
                    name: preparsenal-config
                - secretRef:
                    name: preparsenal-secrets
              resources:
                requests:
                  cpu: 250m
                  memory: 384Mi
                limits:
                  cpu: 750m
                  memory: 1024Mi
