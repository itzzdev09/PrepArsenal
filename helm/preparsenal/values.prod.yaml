replicaCount: 4

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: preparsenal.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.preparsenal.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: preparsenal-prod-tls
      hosts:
        - preparsenal.com
        - www.preparsenal.com

resources:
  limits:
    cpu: 2000m
    memory: 1536Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 4
  maxReplicas: 25
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
